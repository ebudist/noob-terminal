# ~/.tmux.conf. Prefix is Ctrl+B. Press it, release it, then press the next key.

# --- Claude Code in tmux -----------------------------------------------
# Without these, tmux blocks Shift+Enter, desktop notifications do not
# reach Ghostty, and the progress bar stays hidden.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# --- Colors ------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'

# --- Status bar --------------------------------------------------------
# Colours are tokyonight-moon, the same palette Neovim uses.
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#222436,fg=#828bb8'

set -g status-left-length 40
set -g status-left '#[fg=#1b1d2b,bg=#c099ff,bold] #S #[fg=#c099ff,bg=#222436,nobold] '

set -g window-status-separator '#[fg=#3b4261] │ '
set -g window-status-format '#[fg=#636da6]#I #W'
set -g window-status-current-format '#[fg=#1b1d2b,bg=#82aaff,bold] #I #W#{?window_zoomed_flag, ,} #[fg=#222436,bg=#222436]'

# Both #() commands run every status-interval. git-status.sh is symlinked to
# ~/.tmux-git-status.sh because tmux cannot resolve a path relative to itself.
set -g status-right-length 100
set -g status-right '#[fg=#3b4261]│ #[fg=#86e1fc]☸ #(f=${KUBECONFIG:-$HOME/.kube/config}; sed -n "s/^current-context: *//p" $f 2>/dev/null | sed "s/.*@//") #[fg=#3b4261]│ #($HOME/.tmux-git-status.sh "#{pane_current_path}") #[fg=#3b4261]│ #[fg=#636da6]%d-%m-%Y %a #[fg=#3b4261]│ #[fg=#828bb8]%H:%M '

set -g pane-border-style 'fg=#2f334d'
set -g pane-active-border-style 'fg=#82aaff'
set -g message-style 'bg=#c099ff,fg=#1b1d2b'

# --- Shell -------------------------------------------------------------
# Ghostty runs fish, but tmux reads the login shell instead, which is zsh.
# Without this line a pane inside tmux drops back to zsh.
set -g default-shell /opt/homebrew/bin/fish

# --- Comfort -----------------------------------------------------------
set -g mouse on              # click panes, drag borders, scroll with the wheel
set -s escape-time 0         # no lag after pressing Esc
set -g history-limit 50000   # scrollback per pane
set -g base-index 1          # windows start at 1 to match the keyboard
setw -g pane-base-index 1
set -g renumber-windows on   # close window 2 and window 3 becomes 2

# --- Splits ------------------------------------------------------------
# | and - instead of % and ". New panes open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Copy mode ---------------------------------------------------------
# prefix + [ to enter, v to select, y to copy into the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- Reload ------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
