# Starship Prompt Configuration
# Save this as ~/.config/starship.toml

# Overall prompt format
format = """
[┌─](bold blue)\
$username\
$directory\
$kubernetes\
$nodejs\
$python\
$rust\
$golang\
$java\
$php\
$docker_context\
$git_branch\
$git_status\
$line_break\
[└─](bold blue)$character"""

# Username
[username]
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style) "
disabled = false
show_always = true

# Current working directory
[directory]
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

# Kubernetes cluster
[kubernetes]
format = '[☸ $cluster](bold purple) '
disabled = false
# Show kubernetes context always (remove these lines to only show in k8s projects)
detect_files = []
detect_extensions = []
detect_folders = []

# Only show specific contexts (optional - remove if you want to see all)
# [[kubernetes.contexts]]
# context_pattern = "prod.*"
# style = "bold red"
# symbol = "⛔ "

# Git branch
[git_branch]
symbol = " "
style = "bold green"
format = "[$symbol$branch]($style) "

# Git status
[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Prompt character
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"

# Disable modules you don't need
[aws]
disabled = true

[gcloud]
disabled = true

# Enable language/framework detection
[nodejs]
format = "[$symbol($version )]($style)"
symbol = "⬢ "
style = "bold green"
disabled = false
detect_files = ["package.json", ".node-version", "astro.config.mjs", "astro.config.js"]

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = "🐍 "
style = "yellow bold"
disabled = false

[rust]
format = "[$symbol($version )]($style)"
symbol = "🦀 "
style = "bold red"
disabled = false

[golang]
format = "[$symbol($version )]($style)"
symbol = "🐹 "
style = "bold cyan"
disabled = false

[java]
format = "[$symbol($version )]($style)"
symbol = "☕ "
style = "red dimmed"
disabled = false

[php]
format = "[$symbol($version )]($style)"
symbol = "🐘 "
style = "147 bold"
disabled = false

[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "blue bold"
disabled = false
